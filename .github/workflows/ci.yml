name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore CSweet.Office.Independent.slnx -p:UseLocalOfficeContracts=false
      - run: dotnet build CSweet.Office.Independent.slnx -c Release --no-restore -p:UseLocalOfficeContracts=false
      - name: Test independent Office
        shell: pwsh
        run: |
          # dotnet is an intermediate process: pwsh cannot repair its Windows PowerShell children's module path.
          if ($IsWindows) { Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue }
          dotnet test tests/CSweet.Office.Tests/CSweet.Office.Tests.csproj -c Release --no-build -p:UseLocalOfficeContracts=false --logger "trx;LogFileName=office-tests.trx" --results-directory artifacts/test-results
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn
      - name: Test hosted release manifest and archive layout
        shell: pwsh
        run: ./scripts/tests/Test-HostedManifest.ps1
