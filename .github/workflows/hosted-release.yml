name: hosted-development-release
on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - .github/workflows/hosted-release.yml
      - scripts/release/**
      - scripts/linux/new-firecracker-guest.sh
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-hosted-release
  cancel-in-progress: false
jobs:
  metadata:
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $release = ./scripts/release/Get-OfficeReleaseMetadata.ps1 -Tag $env:RELEASE_TAG
          } else {
            [xml]$build = Get-Content Directory.Build.props -Raw
            $release = ./scripts/release/Get-OfficeReleaseMetadata.ps1 -Version ([string]$build.Project.PropertyGroup.VersionPrefix)
          }
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=v$($release.Version)" >> $env:GITHUB_OUTPUT
      - name: Check whether this version needs publishing
        id: check
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              if (release.draft) throw new Error(`Inspect/remove the unpublished draft ${tag} before retrying.`);
              core.info(`${tag} is already published; skipping builds and leaving its assets unchanged.`);
              core.setOutput('should-publish', 'false');
              return;
            }
            core.setOutput('should-publish', 'true');
      - name: Validate unpublished tag and release notes
        if: steps.check.outputs.should-publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $tagCommit = git rev-parse --verify --quiet "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -eq 0) {
            $checkoutCommit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $checkoutCommit) {
              throw 'The existing unpublished tag points at another commit. Dispatch against that tag or use a new version.'
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw 'Could not check the existing release tag.'
          }
          if (-not (Test-Path -LiteralPath "releases/$env:RELEASE_VERSION.md" -PathType Leaf)) {
            throw "Add releases/$env:RELEASE_VERSION.md before publishing this version."
          }
          $global:LASTEXITCODE = 0
  binaries:
    needs: metadata
    if: needs.metadata.outputs.should-publish == 'true'
    strategy:
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test CSweet.Office.Independent.slnx -c Release -p:UseLocalOfficeContracts=false
      - shell: pwsh
        run: ./scripts/release/Build-HostedOfficeBundle.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -OutputRoot artifacts/bundle
      - name: Verify prebuilt payload avoids compilation
        if: matrix.rid == 'win-x64'
        shell: powershell
        run: ./scripts/tests/Test-PrebuiltPayload.ps1 -NodeExecutable artifacts/bundle/components/node/CSweet.Office.Node.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: artifacts/bundle
          if-no-files-found: error
  images:
    needs: metadata
    if: needs.metadata.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-image-sdk
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_DEBUG: '1'
      LIBGUESTFS_TRACE: '1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: sudo apt-get update && sudo apt-get install -y libguestfs-tools qemu-utils debootstrap linux-image-generic isc-dhcp-client
      - name: Select QEMU user networking for image construction
        shell: bash
        run: |
          # Noble's passt profile rejects libguestfs's temporary PID files. Without
          # this optional helper, libguestfs uses QEMU's built-in SLIRP networking.
          # Keep AppArmor enabled and leave the guest's no-network policy unchanged.
          sudo apt-get remove -y --no-auto-remove passt
          if command -v passt >/dev/null 2>&1; then
            echo 'passt is still on PATH; cannot select QEMU user networking.' >&2
            exit 1
          fi
      - name: Prepare and test libguestfs appliance
        shell: bash
        run: |
          mkdir -p artifacts/image-diagnostics
          # Ubuntu restricts /boot/vmlinuz to root. Copy one generic kernel for the
          # unprivileged appliance builder and select its matching modules explicitly.
          kernel=$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*-generic' | sort -V | tail -n 1)
          if [[ -z "$kernel" ]]; then
            echo 'No generic kernel found after installing linux-image-generic.' >&2
            exit 1
          fi
          version=${kernel##*/vmlinuz-}
          if [[ ! -d "/lib/modules/$version" ]]; then
            echo "Missing modules for libguestfs kernel $version." >&2
            exit 1
          fi
          sudo install -m 0644 "$kernel" "$RUNNER_TEMP/libguestfs-vmlinuz"
          export SUPERMIN_KERNEL="$RUNNER_TEMP/libguestfs-vmlinuz"
          export SUPERMIN_KERNEL_VERSION="$version"
          export SUPERMIN_MODULES="/lib/modules/$version"
          printf '%s\n' "SUPERMIN_KERNEL=$SUPERMIN_KERNEL" "SUPERMIN_KERNEL_VERSION=$SUPERMIN_KERNEL_VERSION" "SUPERMIN_MODULES=$SUPERMIN_MODULES" >> "$GITHUB_ENV"
          libguestfs-test-tool 2>&1 | tee artifacts/image-diagnostics/libguestfs-preflight.log
          # Noble's supermin appliance lists isc-dhcp-client, but the default host
          # dependency can supply dhcpcd-base without including it in the appliance.
          # Check real DNS inside the appliance, not only successful VM startup.
          guestfish --network 2>&1 <<'GUESTFISH' | tee artifacts/image-diagnostics/libguestfs-network-preflight.log
          add-drive-scratch 64M
          run
          debug sh "test -s /etc/resolv.conf && getent ahostsv4 archive.ubuntu.com && getent ahostsv4 security.ubuntu.com"
          GUESTFISH
      - name: Build Hyper-V image without nested virtualization
        shell: bash
        run: bash scripts/release/build-hosted-hyperv-image.sh artifacts/windows-guest 2>&1 | tee artifacts/image-diagnostics/hyperv-build.log
      - name: Build Firecracker image
        shell: bash
        run: sudo env "PATH=$PATH" bash scripts/linux/new-firecracker-guest.sh artifacts/linux-guest linux-x64 2>&1 | tee artifacts/image-diagnostics/firecracker-build.log
      - name: Include verified Firecracker tools for offline installation
        run: |
          mkdir -p artifacts/linux-tools
          cd artifacts/linux-tools
          base=https://github.com/firecracker-microvm/firecracker/releases/download/v1.16.1
          curl --fail --location --proto '=https' "$base/firecracker-v1.16.1-x86_64.tgz" -o firecracker-v1.16.1-x86_64.tgz
          curl --fail --location --proto '=https' "$base/firecracker-v1.16.1-x86_64.tgz.sha256.txt" -o checksums
          sha256sum -c checksums
          tar -xzf firecracker-v1.16.1-x86_64.tgz
          cp release-v1.16.1-x86_64/firecracker-v1.16.1-x86_64 firecracker
          cp release-v1.16.1-x86_64/jailer-v1.16.1-x86_64 jailer
      - uses: actions/upload-artifact@v4
        with:
          name: guest-images
          path: |
            artifacts/windows-guest/*
            artifacts/linux-guest/*
            artifacts/linux-tools/firecracker
            artifacts/linux-tools/jailer
          compression-level: 0
          if-no-files-found: error
      - name: Upload image diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-diagnostics
          path: artifacts/image-diagnostics
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [metadata, binaries, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts/download }
      - name: Test hosted release manifest and archive layout
        shell: pwsh
        run: ./scripts/tests/Test-HostedManifest.ps1
      - name: Package immutable development bundles and checksums
        shell: pwsh
        run: ./scripts/release/Publish-HostedOfficeAssets.ps1 -Version '${{ needs.metadata.outputs.version }}' -InputRoot artifacts/download -OutputRoot artifacts/release
      - name: Publish tagged release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; use a new version. Published assets must not be replaced.' }
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --target $env:RELEASE_COMMIT --draft --title "Office $env:RELEASE_VERSION (development signing)" --notes-file "releases/$env:RELEASE_VERSION.md" --repo $env:GITHUB_REPOSITORY @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. Inspect the draft before retrying.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
